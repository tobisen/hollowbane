name: Deep QA (manual; never ordinary release gate)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 tools/ci/release_artifact.py seal --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
  full:
    needs: prepare
    uses: ./.github/workflows/full-regression.yml
    with:
      artifact-ready: true
  extended:
    needs: [prepare, full]
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_REUSE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - run: python3 tools/ci/release_artifact.py verify --sha "$GITHUB_SHA"
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Broader compatibility and retained visual/campaign coverage
        run: npm run test:milestone
      - name: Existing extended generation and loot simulations
        run: npx vitest run --config vitest.deep.config.ts
      - name: Software-rendered benchmark (measurement, not hardware approval)
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/hollowbane-deep-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node --input-type=module -e 'import {request,expect} from "@playwright/test"; const r=await request.newContext(); await expect.poll(async()=>{try{return(await r.get("http://127.0.0.1:4173/hollowbane/")).status()}catch{return 0}}).toBe(200); await r.dispose()'
          npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-measurements
          path: |
            playwright-report/results.json
            .local/*benchmark*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deep-failure
          path: test-results/
          retention-days: 10
