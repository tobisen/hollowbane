name: Verify and deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "auto uses impact; full is required for milestones"
        type: choice
        options: [auto, full]
        default: auto
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    permissions:
      contents: read
      actions: read
    name: Fast static, contracts and Chromium smoke
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
    env:
      PLAYWRIGHT_REUSE_BUILD: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classify content and transitive imports; unknown means Full
        id: plan
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_HISTORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RELEASE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          CI_TIER: ${{ startsWith(github.ref, 'refs/tags/') && 'full' || inputs.tier || 'auto' }}
        run: node scripts/ci-policy.mjs plan
      - name: Static, critical and affected contracts; one production build
        run: |
          node scripts/validate-ci-workflows.mjs
          npm run typecheck
          npm run lint
          npm run format:check
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          node scripts/ci-policy.mjs unit
          npm run build
      - run: python3 tools/ci/release_artifact.py seal --sha "$GITHUB_SHA"
      - run: npx playwright install --with-deps chromium
      - name: Stable core smoke and required affected integration
        run: node scripts/ci-policy.mjs browser
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-plan
          path: ci-plan.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-results
          path: playwright-report/results.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fast-failure
          path: test-results/
          retention-days: 10

  full:
    name: Required Full Regression
    needs: fast
    if: needs.fast.outputs.tier == 'full'
    uses: ./.github/workflows/full-regression.yml
    with:
      artifact-ready: true

  verify:
    needs: [fast, full]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the selected risk gate including skipped/cancelled failures
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
          REQUIRED_TIER: ${{ needs.fast.outputs.tier }}
        run: bash tools/ci/risk_gate.sh
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - run: python3 tools/ci/release_artifact.py verify --sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  hosted-smoke:
    name: Hosted exact SHA and selected critical flow
    needs: deploy
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - run: python3 tools/ci/release_artifact.py hosted --sha "$RELEASE_SHA" --url "$PLAYWRIGHT_BASE_URL"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci-policy.mjs hosted
      - name: Record the tier that authorized this exact release
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("ci-plan.json")); require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Released "+process.env.RELEASE_SHA+" through "+p.tier+" plus Pages and hosted smoke.\n")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-smoke-results
          path: playwright-report/results.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hosted-smoke-failure
          path: test-results/
          retention-days: 10
