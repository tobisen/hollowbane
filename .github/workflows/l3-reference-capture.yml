name: L3 Linux reference candidates
on:
  push:
    branches: [main]
    paths: [.github/workflows/l3-reference-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config playwright.inventory.config.ts --grep 'advanced unique inspection|component grades|explicit socket preview' --update-snapshots
        env:
          HOLLOWBANE_CAPTURE_VISUALS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-linux-reference-candidates
          path: tests/e2e/advanced-inventory*.spec.ts-snapshots/*-linux.png
